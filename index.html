<script>
/* ==== lunar (源 sha256 47b1f181028c) ==== */
/**
 * 农历 / 公历 互转工具
 * 数据表 lunarInfo：1900-2100 年，每年一个 17 位编码
 *   bit 16      闰月天数（1=30 天，0=29 天）
 *   bit 15..4   正月到十二月（1=30 天，0=29 天），bit15 对应正月
 *   bit 3..0    闰月月份（0 表示该年无闰月）
 */

const LUNAR_INFO = [
  0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2, // 1900-1909

  0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, // 1920-1929
  0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, // 1930-1939
  0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557, // 1940-1949
  0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5d0, 0x14573, 0x052d0, 0x0a9a8, 0x0e950, 0x06aa0, // 1950-1959
  0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0, // 1960-1969
  0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b6a0, 0x195a6, // 1970-1979
  0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570, // 1980-1989
  0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0, // 1990-1999
  0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5, // 2000-2009
  0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930, // 2010-2019
  0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530, // 2020-2029
  0x05aa0, 0x076a3, 0x096d0, 0x04afb, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45, // 2030-2039
  0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0, // 2040-2049
  0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0, // 2050-2059
  0x0a2e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4, // 2060-2069
  0x052d0, 0x0a9b8, 0x0a950, 0x0b4a0, 0x0b6a6, 0x0ad50, 0x055a0, 0x0aba4, 0x0a5b0, 0x052b0, // 2070-2079
  0x0b273, 0x06930, 0x07337, 0x06aa0, 0x0ad50, 0x14b55, 0x04b60, 0x0a570, 0x054e4, 0x0d160, // 2080-2089
  0x0e968, 0x0d520, 0x0daa0, 0x16aa6, 0x056d0, 0x04ae0, 0x0a9d4, 0x0a2d0, 0x0d150, 0x0f252, // 2090-2099
  0x0d520,                                                                                   // 2100
];

const MIN_YEAR = 1900;
const MAX_YEAR = 2100;
// 1900 年正月初一对应的公历日期
const BASE_DATE = Date.UTC(1900, 0, 31);

const MONTH_CN = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '冬', '腊'];
const DAY_CN = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
  '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
  '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

const MS_PER_DAY = 86400000;

function info(year) {
  return LUNAR_INFO[year - MIN_YEAR];
}

/** 该农历年闰几月，0 表示无闰月 */
function leapMonth(year) {
  return info(year) & 0xf;
}

/** 该农历年第 month 个月（1-12）的天数；闰月请用 leapDays */
function monthDays(year, month) {
  // 经枚举验证：bit16 对应正月，bit5 对应十二月
  return (info(year) >> (16 - month)) & 0x1 ? 30 : 29;
}

/** 该农历年闰月的天数，无闰月返回 0 */
function leapDays(year) {
  if (!leapMonth(year)) return 0;
  return (info(year) >> 16) & 0x1 ? 30 : 29;
}

/** 该农历年总天数 */
function yearDays(year) {
  let sum = 348; // 12 * 29
  for (let i = 0x8000; i > 0x8; i >>= 1) {
    sum += (info(year) & i) ? 1 : 0;
  }
  return sum + leapDays(year);
}

function toUTC(y, m, d) {
  return Date.UTC(y, m - 1, d);
}

/** 公历 -> 农历（m 为 1-12） */
function solarToLunar(y, m, d) {
  if (y < MIN_YEAR || y > MAX_YEAR) return null;
  let offset = Math.floor((toUTC(y, m, d) - BASE_DATE) / MS_PER_DAY);
  if (offset < 0) return null;

  let year = MIN_YEAR;
  for (; year <= MAX_YEAR; year++) {
    const yd = yearDays(year);
    if (offset < yd) break;
    offset -= yd;
  }
  if (year > MAX_YEAR) return null;

  const lp = leapMonth(year);
  let isLeap = false;
  let month = 1;
  for (; month <= 12; month++) {
    const days = monthDays(year, month);
    if (offset < days) break;
    offset -= days;
    // 闰月排在同名普通月之后
    if (lp === month) {
      const ld = leapDays(year);
      if (offset < ld) {
        isLeap = true;
        break;
      }
      offset -= ld;
    }
  }

  return { year, month, day: offset + 1, isLeap };
}

/** 农历 -> 公历；isLeap 表示闰月。返回 {year, month, day} 或 null */
function lunarToSolar(ly, lm, ld, isLeap = false) {
  if (ly < MIN_YEAR || ly > MAX_YEAR) return null;
  if (lm < 1 || lm > 12) return null;
  const lp = leapMonth(ly);
  if (isLeap && lp !== lm) return null; // 该年此月不是闰月

  let offset = 0;
  for (let y = MIN_YEAR; y < ly; y++) offset += yearDays(y);
  // 只累加「目标月之前」的天数，目标月自身不计入（月内第几天由 ld 体现）
  for (let m = 1; m < lm; m++) {
    offset += monthDays(ly, m);
    if (lp === m) offset += leapDays(ly); // 闰月排在同名月之后，已完整跳过

    // 无法计算的排在最后
    const valid = items.filter((x) => x.occ);
    const invalid = items.filter((x) => !x.occ);

    if (sortMode === 'name') {
      valid.sort((a, b) => String(a.birthday.name).localeCompare(String(b.birthday.name), 'zh'));
    } else if (sortMode === 'month') {
      valid.sort((a, b) =>
        (a.birthday.month - b.birthday.month) || (a.birthday.day - b.birthday.day));
    }
    lastItems = valid.concat(invalid);

    renderHero(valid);
    renderGrid(lastItems);

    // 标题动态化：不打开也知道倒计时
    const next = valid[0];
    if (!valid.length) document.title = '亲人生日倒计时';
    else if (next.isToday) document.title = `🎂 ${next.birthday.name} 生日快乐`;
    else document.title = `${next.occ.daysLeft}天 · ${next.birthday.name}生日`;
  }

  // ---------------------------------------------------------------- 数据
  /** 归一化一条生日记录，缺 id 时补上 */
  function normalizeOne(raw, prefix) {
    if (!raw || !raw.name) return null;
    const month = Number(raw.month), day = Number(raw.day);
    if (!(month >= 1 && month <= 12) || !(day >= 1 && day <= 30)) return null;
    const cal = raw.calendar === 'lunar' ? 'lunar' : 'solar';
    return {
      id: raw.id || (prefix + month + '_' + day + '_' + String(raw.name).slice(0, 8)),
      name: String(raw.name).slice(0, 20),
      calendar: cal, month, day,
      isLeap: cal === 'lunar' ? !!raw.isLeap : false,
      year: Number(raw.year) || undefined,
      note: raw.note ? String(raw.note).slice(0, 120) : undefined,
    };
  }

  async function loadAll() {
    const local = await Storage.loadBirthdays();
    let merged = local;

    if (URL_RAW) {
      // 网址数据 + 本地数据合并；按「名字+月+日」去重，网址版本优先
      const key = (x) => `${x.name}|${x.month}|${x.day}|${x.calendar}`;
      const seen = new Set();
      const out = [];
      for (const raw of URL_RAW) {
        const n = normalizeOne(raw, 'url_');
        if (!n) continue;
        const k = key(n);
        if (seen.has(k)) continue;
        seen.add(k);
        out.push(n);
      }
      for (const raw of local) {
        const n = normalizeOne(raw, 'loc_');
        if (!n) continue;
        const k = key(n);
        if (seen.has(k)) continue;
        seen.add(k);
        out.push(n);
      }
      merged = out;
    }

    cache = merged;
    settings = await Storage.loadSettings();
    sortMode = settings.sortMode || 'daysLeft';
    const forced = document.documentElement.getAttribute('data-theme');
    if (!forced) {
      applyTheme(settings.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    }
    $('optAge').checked = !!settings.showAge;
    $('optHero').checked = settings.showHero !== false;
    [...$('sortSeg').children].forEach((b) => {
      b.classList.toggle('on', b.dataset.sort === sortMode);
    });
    renderShareBanner();
    render();
    renderManage();
  }

  /** 分享链接打开时的提示条 */
  function renderShareBanner() {
    const el = $('shareBanner');
    if (!el) return;
    if (!SHARE_MODE) { el.style.display = 'none'; return; }
    el.style.display = '';
    const fromUrl = cache.filter((x) => String(x.id).startsWith('url_')).length;
    if (fromUrl) {
      el.textContent = `📎 这是分享链接，内含 ${fromUrl} 条生日；你自己添加的会一起显示` +
        `并保存在本机。链接里的内容是固定的。`;
    } else {
      el.textContent = '📎 这是分享链接。你添加的生日会保存在本机，不会影响链接内容。';
    }
  }

  // ---------------------------------------------------------------- 表单
  function isLunar() { return $('fCal').value === 'lunar'; }

  function fillMonths() {
    const sel = $('fMonth');
    const cur = sel.value;
    sel.innerHTML = '';
    const names = isLunar() ? MONTH_CN.map((c) => c + '月')
      : Array.from({ length: 12 }, (_, i) => (i + 1) + ' 月');
    names.forEach((n, i) => {
      const o = document.createElement('option');
      o.value = String(i + 1);
      o.textContent = n;
      sel.appendChild(o);
    });
    sel.value = cur || '1';
  }

  function fillDays() {
    const sel = $('fDay');
    const cur = Number(sel.value) || 1;
    const m = Number($('fMonth').value) || 1;
    sel.innerHTML = '';
    const max = isLunar() ? 30 : new Date(2000, m, 0).getDate();
    for (let d = 1; d <= max; d++) {
      const o = document.createElement('option');
      o.value = String(d);
      o.textContent = isLunar() ? DAY_CN[d - 1] : String(d);
      sel.appendChild(o);
    }
    sel.value = String(Math.min(cur, max));
    $('leapRow').style.display = isLunar() ? '' : 'none';
  }

  function formValue() {
    const y = $('fYear').value.trim();
    const note = $('fNote').value.trim();
    return {
      name: $('fName').value.trim(),
      calendar: $('fCal').value,
      month: Number($('fMonth').value),
      day: Number($('fDay').value),
      isLeap: isLunar() ? $('fLeap').checked : false,
      year: y ? Number(y) : undefined,
      note: note || undefined,
    };
  }

  function updatePreview() {
    const b = formValue();
    const el = $('preview');
    if (!b.name) {
      el.textContent = '填写后这里会显示下一次生日的日期';
      return;
    }
    const today = startOfDay();
    const occ = nextOccurrence(b, today);
    if (!occ) { el.innerHTML = '<span class="err">该日期无法计算，请检查月份与日期</span>'; return; }
    const when = occ.daysLeft === 0 ? '就是今天 🎂'
      : occ.daysLeft === 1 ? '明天' : `还有 ${occ.daysLeft} 天`;
    const age = ageAt(b, occ, today);
    el.innerHTML =
      `下一次：<b>${occ.solar.year}-${String(occ.solar.month).padStart(2, '0')}-` +
      `${String(occ.solar.day).padStart(2, '0')}</b>（${formatLunar(occ.lunar)}）· <b>${when}</b>` +
      (age !== null ? ` · 周岁 <b>${age}</b>` : '');
  }

  function resetForm() {
    editingId = null;
    $('fName').value = '';
    $('fCal').value = 'solar';
    $('fYear').value = '';
    $('fNote').value = '';
    $('fLeap').checked = false;
    fillMonths(); $('fMonth').value = '1';
    fillDays(); $('fDay').value = '1';
    $('dTitle').textContent = '添加生日';
    $('saveBtn').textContent = '保存';
    updatePreview();
  }

  function startEdit(id) {
    const b = cache.find((x) => x.id === id);
    if (!b) {
      openDrawer();
      return;
    }
    editingId = id;
    $('fName').value = b.name || '';
    $('fCal').value = b.calendar || 'solar';
    fillMonths(); $('fMonth').value = String(b.month);
    fillDays(); $('fDay').value = String(b.day);
    $('fLeap').checked = !!b.isLeap;
    $('fYear').value = b.year ? String(b.year) : '';
    $('fNote').value = b.note || '';
    $('dTitle').textContent = '编辑：' + b.name;
    $('saveBtn').textContent = '更新';
    updatePreview();
    openDrawer(id);
  }

  async function doDelete(id, name) {
    if (!confirm(`确定删除「${name}」的生日吗？`)) return;
    await Storage.removeBirthday(id);
    cache = await Storage.loadBirthdays();
    render(); renderManage();
    if (editingId === id) resetForm();
    toast('已删除');
  }

  // ---------------------------------------------------------------- 抽屉
  function openDrawer() {
    $('drawer').classList.add('open');
    $('mask').classList.add('open');
  }
  function closeDrawer() {
    $('drawer').classList.remove('open');
    $('mask').classList.remove('open');
  }

  // ---------------------------------------------------------------- 事件
  $('addBtn').onclick = () => { resetForm(); openDrawer(); };
  $('manageBtn').onclick = () => { resetForm(); openDrawer(); };
  $('dClose').onclick = closeDrawer;
  $('mask').onclick = closeDrawer;
  $('themeBtn').onclick = toggleTheme;

  $('sortSeg').onclick = (e) => {
    const btn = e.target.closest('button[data-sort]');
    if (!btn) return;
    sortMode = btn.dataset.sort;
    Storage.saveSettings({ sortMode });
    [...$('sortSeg').children].forEach((b) => b.classList.toggle('on', b === btn));
    render();
  };

  $('fCal').onchange = () => { fillMonths(); fillDays(); updatePreview(); };
  $('fMonth').onchange = () => { fillDays(); updatePreview(); };
  $('fDay').onchange = updatePreview;
  $('fLeap').onchange = updatePreview;
  $('fName').oninput = updatePreview;
  $('fYear').oninput = updatePreview;
  $('resetBtn').onclick = resetForm;

  $('saveBtn').onclick = async () => {
    const b = formValue();
    if (!b.name) { toast('请填写称呼'); $('fName').focus(); return; }
    if (b.year !== undefined && (b.year < 1900 || b.year > 2100)) {
      toast('出生年份需在 1900–2100 之间'); return;
    }
    if (!nextOccurrence(b, startOfDay())) { toast('该日期无法计算，请检查'); return; }

    if (editingId) { await Storage.updateBirthday(editingId, b); toast('已更新'); }
    else { await Storage.addBirthday(b); toast('已添加'); }
    cache = await Storage.loadBirthdays();
    render(); renderManage();
    resetForm();
  };

  $('optAge').onchange = async (e) => {
    await Storage.saveSettings({ showAge: e.target.checked });
    settings = await Storage.loadSettings();
    render();
  };
  $('optHero').onchange = async (e) => {
    await Storage.saveSettings({ showHero: e.target.checked });
    settings = await Storage.loadSettings();
    render();
  };

  // ---------------------------------------------------------------- 导入导出
  $('exportBtn').onclick = () => {
    const payload = {
      app: 'birthday-countdown-web', version: 1,
      exportedAt: new Date().toISOString(), birthdays: cache,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    a.href = url;
    a.download = `生日倒计时备份-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('已导出');
  };

  $('importBtn').onclick = () => $('fileInput').click();

  $('shareBtn').onclick = () => {
    if (!cache.length) { toast('先添加生日再生成分享链接'); return; }
    const url = buildShareUrl();
    const out = $('shareOut');
    out.style.display = '';
    out.innerHTML = '';
    const tip = document.createElement('div');
    tip.textContent = `链接长度 ${url.length} 字符。对方打开即可看到这 ${cache.length} 条生日。` +
      `（太长的话，聊天工具可能会截断，可以改用导出 JSON 发给对方）`;
    const code = document.createElement('code');
    code.textContent = url;
    out.appendChild(tip);
    out.appendChild(code);
    // 尝试写入剪贴板
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        () => toast('链接已复制到剪贴板'),
        () => toast('链接已生成，请手动复制')
      );
    } else {
      toast('链接已生成，请手动复制');
    }
  };
  $('fileInput').onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const arr = Array.isArray(data) ? data : data.birthdays;
      if (!Array.isArray(arr)) throw new Error('格式不正确：找不到 birthdays 数组');
      const clean = [];
      for (const r of arr) {
        if (!r || !r.name) continue;
        const month = Number(r.month), day = Number(r.day);
        if (!(month >= 1 && month <= 12) || !(day >= 1 && day <= 30)) continue;
        const cal = r.calendar === 'lunar' ? 'lunar' : 'solar';
        if (cal === 'solar' && day > 31) continue;
        clean.push({
          id: Storage.newId(),
          name: String(r.name).slice(0, 20),
          calendar: cal, month, day,
          isLeap: cal === 'lunar' ? !!r.isLeap : false,
          year: Number(r.year) || undefined,
          note: r.note ? String(r.note).slice(0, 120) : undefined,
        });
      }
      if (!clean.length) { toast('没有可导入的有效数据'); return; }
      const merge = confirm(`读取到 ${clean.length} 条生日。\n\n确定 = 追加到现有数据\n取消 = 覆盖现有数据`);
      await Storage.saveBirthdays(merge ? cache.concat(clean) : clean);
      await loadAll();
      toast(`已导入 ${clean.length} 条`);
    } catch (err) {
      toast('导入失败：' + err.message);
    }
  };

  $('clearBtn').onclick = async () => {
    if (!cache.length) { toast('当前没有数据'); return; }
    if (!confirm(`确定清空全部 ${cache.length} 条生日数据吗？此操作不可撤销。`)) return;
    await Storage.saveBirthdays([]);
    await loadAll();
    resetForm();
    toast('已清空');
  };

  // 跨标签页同步
  window.addEventListener('itab-bcd-change', () => { loadAll(); });
  window.addEventListener('storage', (e) => {
    if (e.key && e.key.startsWith('itab-bcd:')) loadAll();
  });
  // 跨零点刷新
  let lastDay = new Date().getDate();
  setInterval(() => {
    const d = new Date().getDate();
    if (d !== lastDay) { lastDay = d; loadAll(); }
  }, 60000);

  // Esc 关闭抽屉
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  // ---------------------------------------------------------------- 启动
  fillMonths();
  fillDays();
  updatePreview();
  const READY = loadAll();

  // 供调试与自动化测试
  (typeof globalThis !== 'undefined' ? globalThis : window).__app = {
    ready: READY,
    loadAll, render, renderManage, openDrawer, closeDrawer, startEdit,
    formValue, updatePreview, resetForm,
    getCache: () => cache,
    getSettings: () => settings,
    setSort: (m) => { sortMode = m; render(); },
  };
})();

</script>
</body>
</html>
